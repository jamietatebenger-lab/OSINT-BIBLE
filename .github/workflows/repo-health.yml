name: Repo health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  classify-evidence-links:
    name: Link HTTP classification (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  data-validate:
    name: Validate data layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate schema and content
        run: python3 scripts/validate_data.py
      - name: Check generated README tables
        run: python3 scripts/build_readme.py --check
      - name: Probe a sample of URLs
        run: python3 scripts/validate_data.py --check-links --limit 20

  link-check:
    name: Link health (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config ./lychee.toml
            --no-progress
            README.md countries/*.md
          fail: false
          jobSummary: true
          format: markdown
          output: ./lychee/report.md
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/report.md

  freshness:
    name: Staleness guard (countries)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Flag stale country files
        run: |
          python3 - <<'PY'
          import re, pathlib, datetime
          today = datetime.date.today()
          stale = []
          missing = []
          for p in sorted(pathlib.Path("countries").glob("*.md")):
              if p.name.startswith("_") or p.name == "README.md":
                  continue
              content = p.read_text(encoding="utf-8")
              m = re.search(r"Last reviewed:\s*(\d{4}-\d{2}-\d{2})", content)
              if not m:
                  missing.append(p.name)
                  continue
              d = datetime.date.fromisoformat(m.group(1))
              days = (today - d).days
              if days > 180:
                  stale.append((p.name, f"{days} days old"))
          if missing:
              print("::warning::missing Last reviewed date: " + ", ".join(missing))
          if stale:
              print("::warning::stale country files: " +
                    "; ".join(f"{n} ({r})" for n, r in stale))
          else:
              print("OK: all country files reviewed within 180 days")
          PY
